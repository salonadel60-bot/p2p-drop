<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>P2P Drop</title>
  <style>
    :root {
      --bg-primary: #0f0f23;
      --bg-secondary: #1a1a2e;
      --bg-card: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent: #4a9eff;
      --success: #00c853;
      --error: #ff5252;
      --border: #2a2a4a;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      -webkit-app-region: drag;
    }

    header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .device-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .content { flex: 1; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    /* Peers */
    .peers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.75rem;
    }

    .peer-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .peer-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .peer-card.selected { border-color: var(--accent); background: #0f3460; }
    .peer-icon { font-size: 2rem; margin-bottom: 0.25rem; }
    .peer-name { font-size: 0.8rem; font-weight: 600; }
    .peer-platform { font-size: 0.7rem; color: var(--text-secondary); }

    .empty-peers {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Actions */
    .actions { display: flex; gap: 0.75rem; }

    .btn {
      flex: 1;
      padding: 0.75rem;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn:hover { border-color: var(--accent); background: #0f3460; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Transfers */
    .transfers { display: flex; flex-direction: column; gap: 0.5rem; }

    .transfer-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
    }

    .transfer-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg-primary);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a855f7);
      transition: width 0.3s;
    }

    .transfer-status {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    /* Dialog */
    .dialog-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .dialog {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 400px;
      width: 90%;
    }

    .dialog h3 { margin-bottom: 0.75rem; }
    .dialog p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem; }
    .dialog-actions { display: flex; gap: 0.5rem; }

    .dialog-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .dialog-btn.accept { background: var(--accent); color: white; }
    .dialog-btn.reject { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>P2P Drop</h1>
      <div id="device-badge" class="device-badge">Initializing...</div>
    </header>

    <div class="content">
      <div>
        <div class="section-title">Nearby Devices</div>
        <div id="peers" class="peers-grid">
          <div class="empty-peers">Scanning for devices on your network...</div>
        </div>
      </div>

      <div class="actions">
        <button id="send-btn" class="btn" disabled>Select Files to Send</button>
      </div>

      <div>
        <div class="section-title">Transfers</div>
        <div id="transfers" class="transfers">
          <div class="empty-peers">No active transfers</div>
        </div>
      </div>
    </div>
  </div>

  <div id="dialog-container"></div>

  <script src="renderer.js"></script>
</body>
</html>
